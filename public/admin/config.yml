# Local: run `npm run cms` in a second terminal, then open http://localhost:4321/admin
# Production (Netlify): enable Netlify Identity + Git Gateway on your site
local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts: ['localhost:4321', '127.0.0.1:4321']

backend:
  name: github
  repo: sihphirkohhran/sihphir-kohhran
  branch: main

# Used when publishing to Netlify (set in Netlify site settings if different)
# site_url: https://your-site.netlify.app
# display_url: https://your-site.netlify.app

media_folder: "public/images"
public_folder: "/images"

# ── ARCHIVE REGISTRY (add / edit / delete lists) ──────────────────────────
collections:

  - name: "archive_registry"
    label: "Archive Registry"
    files:

      - name: "committees_registry"
        label: "Committee List (Add / Edit / Delete)"
        file: "src/content/settings/committees.json"
        fields:
          - label: "Committees"
            name: "committees"
            widget: "list"
            allow_add: true
            allow_delete: true
            allow_reorder: true
            fields:
              - { label: "ID (slug, e.g. kohhran)", name: "id", widget: "string", hint: "Lowercase, no spaces. Used in filenames." }
              - { label: "Display Name", name: "name", widget: "string" }
              - { label: "Main Committee", name: "is_main", widget: "boolean", default: false, required: false }

      - name: "gallery_categories_registry"
        label: "Gallery Categories (Add / Edit / Delete)"
        file: "src/content/settings/gallery-categories.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            allow_add: true
            allow_delete: true
            allow_reorder: true
            hint: "After saving new categories, wait a moment then press F5 on admin — Gallery dropdown will update."
            fields:
              - { label: "ID (slug)", name: "id", widget: "string", hint: "Lowercase slug, e.g. christmas" }
              - { label: "Display Name", name: "name", widget: "string", hint: "Shown in Gallery upload dropdown, e.g. Christmas" }

      - name: "document_categories_registry"
        label: "Document Categories (Add / Edit / Delete)"
        file: "src/content/settings/document-categories.json"
        fields:
          - label: "Categories (excluding KTP Inleng)"
            name: "categories"
            widget: "list"
            allow_add: true
            allow_delete: true
            allow_reorder: true
            fields:
              - { label: "ID (slug)", name: "id", widget: "string" }
              - { label: "Display Name", name: "name", widget: "string" }
              - { label: "Badge Label", name: "badge", widget: "string", required: false }

      - name: "admin_auth"
        label: "Admin Login Settings"
        file: "src/content/settings/admin-auth.json"
        fields:
          - { label: "Login Title", name: "login_title", widget: "string" }
          - { label: "Login Subtitle", name: "login_subtitle", widget: "string" }
          - { label: "Local Dev Password", name: "local_password", widget: "string", hint: "Change before handover. Used on localhost only." }
          - { label: "Session Duration (hours)", name: "session_hours", widget: "number", value_type: "int", default: 8, min: 1, max: 72 }

# ── SITE SETTINGS ──────────────────────────────────────────
  - name: "site_settings"
    label: "Site Settings"
    files:

      - name: "general"
        label: "General Settings"
        file: "src/content/settings/general.json"
        fields:
          - { label: "Church Name", name: "church_name", widget: "string", default: "Sihphir Presbyterian Kohhran" }
          - { label: "Founded Year", name: "founded_year", widget: "string", default: "19XX" }
          - { label: "Facebook URL", name: "facebook_url", widget: "string", required: false }
          - { label: "YouTube URL", name: "youtube_url", widget: "string", required: false }
          - { label: "Church Secretary Name", name: "secretary_name", widget: "string" }
          - { label: "Secretary Phone", name: "secretary_phone", widget: "string" }
          - { label: "Secretary Email", name: "secretary_email", widget: "string", required: false }
          - { label: "Address", name: "address", widget: "string", default: "Sihphir, Aizawl District, Mizoram" }
          - { label: "Looker Studio Dashboard URL", name: "looker_url", widget: "string", required: false }

  - name: "homepage"
    label: "Homepage"
    files:

      - name: "hero_slides"
        label: "Hero Slideshow"
        file: "src/content/settings/hero.json"
        fields:
          - label: "Slides"
            name: "slides"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Caption (Mizo)", name: "caption", widget: "string" }

      - name: "statistics"
        label: "Statistics at a Glance"
        file: "src/content/settings/statistics.json"
        fields:
          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }

      - name: "pastor_message"
        label: "Pastor's Message"
        file: "src/content/settings/pastor.json"
        fields:
          - { label: "Pastor Name", name: "name", widget: "string" }
          - { label: "Pastor Title", name: "title", widget: "string", default: "Head Pastor · Sihphir Kohhran" }
          - { label: "Pastor Photo", name: "photo", widget: "image", required: false }
          - { label: "Message", name: "message", widget: "text" }

      - name: "church_history"
        label: "Church History"
        file: "src/content/settings/history.json"
        fields:
          - { label: "Church Building Photo", name: "building_photo", widget: "image", required: false }
          - { label: "Short History (shown by default)", name: "short", widget: "text" }
          - { label: "Full History (shown after Read More)", name: "full", widget: "markdown" }

      - name: "prayer_topics"
        label: "Tawngtai Thupui (Prayer Topics)"
        file: "src/content/settings/prayer.json"
        fields:
          - label: "Prayer Topics"
            name: "topics"
            widget: "list"
            field: { label: "Topic", name: "topic", widget: "string" }

      - name: "quick_links"
        label: "Quick Links (Homepage)"
        file: "src/content/settings/quick-links.json"
        fields:
          - label: "Quick Links"
            name: "links"
            widget: "list"
            allow_add: true
            allow_delete: true
            allow_reorder: true
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Description", name: "description", widget: "string", required: false }
              - { label: "Link URL", name: "href", widget: "string", hint: "e.g. /#notice-board" }
              - { label: "Action", name: "action", widget: "select", options: ["section", "tab-weekly", "tab-monthly"], required: false, hint: "Opens Notice Board tab when on homepage" }

      - name: "highlights"
        label: "Homepage Highlights"
        file: "src/content/settings/highlights.json"
        fields:
          - label: "Highlight Items"
            name: "items"
            widget: "list"
            allow_add: true
            allow_delete: true
            allow_reorder: true
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
              - { label: "Type", name: "type", widget: "select", options: ["page", "photo", "document"], default: "page" }
              - { label: "Display Style", name: "style", widget: "select", options: ["card", "button", "banner"], default: "card" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Link URL", name: "link", widget: "string", hint: "Page path, document URL, or /gallery" }

# ── DYNAMIC PAGES ──────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "src/content/pages"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "Short Description", name: "description", widget: "string", required: false }
      - { label: "URL Path", name: "path", widget: "string", required: false, hint: "Leave empty for /p/page-slug. Custom paths (e.g. /about) are generated automatically on build." }
      - { label: "Show in Navigation", name: "show_in_nav", widget: "boolean", default: false, hint: "When enabled, this page is added to the menu automatically (no manual nav entry required)." }
      - { label: "Nav Menu Key", name: "nav_key", widget: "string", required: false, hint: "Unique key for active state and submenu parent, e.g. about-us" }
      - { label: "Nav Order", name: "nav_order", widget: "number", value_type: "int", required: false, hint: "Lower numbers appear first in the menu" }
      - { label: "Parent Menu Key", name: "nav_parent", widget: "string", required: false, hint: "Parent submenu key — must match Navigation Menu → Menu Key exactly (e.g. fellowship for Fellowship submenu). Case-insensitive." }
      - { label: "Page Content", name: "body", widget: "markdown" }

# ── NOTICE BOARD ──────────────────────────────────────────
  - name: "weekly_schedule"
    label: "Weekly Schedule (Notice Board)"
    label_singular: "Weekly Schedule Entry"
    folder: "src/content/notices/weekly"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { label: "Week Of (Start Date)", name: "week_start", widget: "datetime", format: "DD.MM.YYYY", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Week Of (End Date)", name: "week_end", widget: "string" }
      - label: "Service Days"
        name: "days"
        widget: "list"
        fields:
          - { label: "Day Name (e.g. Nilaini 20.05.2026)", name: "day", widget: "string" }
          - label: "Duties"
            name: "duties"
            widget: "list"
            fields:
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }

  - name: "monthly_duties"
    label: "Monthly Duties (Notice Board)"
    label_singular: "Monthly Duties Entry"
    folder: "src/content/notices/monthly"
    create: true
    slug: "{{year}}-{{month}}"
    fields:
      - { label: "Month", name: "month", widget: "string", hint: "e.g. May 2026" }
      - label: "Duty Sections"
        name: "sections"
        widget: "list"
        fields:
          - { label: "Section Title", name: "title", widget: "string", hint: "e.g. Inkhawm Hruaitu" }
          - label: "Duties"
            name: "duties"
            widget: "list"
            fields:
              - { label: "Role (optional)", name: "role", widget: "string", required: false }
              - { label: "Name", name: "name", widget: "string" }

  - name: "notices"
    label: "Notices & Announcements"
    label_singular: "Notice"
    folder: "src/content/notices/announcements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "DD.MM.YYYY", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Content", name: "body", widget: "markdown" }
      - { label: "PDF Attachment (optional)", name: "pdf_url", widget: "file", required: false, media_folder: "/public/documents", public_folder: "/documents" }

# ── DOCUMENTS ──────────────────────────────────────────
  - name: "ktp_inleng"
    label: "KTP Inleng (Weekly Bulletins)"
    label_singular: "KTP Inleng Issue"
    folder: "src/content/documents/ktp-inleng"
    create: true
    identifier_field: name
    slug: "{{year}}-{{month}}-{{day}}"
    media_folder: "/public/documents"
    public_folder: "/documents"
    summary: "{{name}}"
    fields:
      - { label: "Year", name: "year", widget: "number", value_type: "int", min: 2000, max: 2099 }
      - { label: "Month", name: "month", widget: "number", value_type: "int", min: 1, max: 12, required: false }
      - { label: "Issue Date", name: "date", widget: "datetime", format: "DD.MM.YYYY", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Display Name", name: "name", widget: "string", hint: "e.g. KTP Inleng — 18.05.2026" }
      - { label: "Pin to top of category", name: "pinned", widget: "boolean", default: false, required: false }
      - label: "Upload PDF (from computer)"
        name: "pdf_url"
        widget: "file"
        choose_url: false
        media_folder: "/public/documents"
        public_folder: "/documents"
        media_library:
          config:
            max_file_size: 52428800
        hint: "PDF, DOC, or DOCX. Saved to public/documents/. Run `npm run cms` in a second terminal when editing locally."
      - label: "Or external link (Google Drive, etc.)"
        name: "pdf_external"
        widget: "string"
        required: false
        hint: "Use only if not uploading a file. Paste full https:// link."

  - name: "documents_other"
    label: "Documents (Year Book, Minutes, Reports, etc.)"
    label_singular: "Document"
    folder: "src/content/documents/other"
    create: true
    identifier_field: doc_id
    slug: "{{doc_id}}"
    media_folder: "/public/documents"
    public_folder: "/documents"
    summary: "{{name}}"
    fields:
      - { label: "Document ID (filename)", name: "doc_id", widget: "string", pattern: ['^[a-z0-9][a-z0-9-]*$', 'Lowercase letters, numbers, hyphens only — e.g. yearbook-2025'] }
      - { label: "Name", name: "name", widget: "string" }
      # >>> DOCUMENT_CATEGORY_SELECT >>>
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Year Book", "Minutes", "Reports", "Notice & Circulars", "Other", "Rawngbawltu list"]
        hint: "From Archive Registry → Document Categories. After adding categories, save registry, then press F5 on admin (auto-syncs when npm run dev is running)."
      # <<< DOCUMENT_CATEGORY_SELECT <<<
      - { label: "Year", name: "year", widget: "number", value_type: "int", min: 2000, max: 2099, required: false }
      - { label: "Month", name: "month", widget: "number", value_type: "int", min: 1, max: 12, required: false }
      - { label: "Date label (shown on site)", name: "date", widget: "string", hint: "e.g. 2025 or 18.05.2026" }
      - { label: "Pin to top of category", name: "pinned", widget: "boolean", default: false, required: false }
      - label: "Upload PDF (from computer)"
        name: "pdf_url"
        widget: "file"
        choose_url: false
        media_folder: "/public/documents"
        public_folder: "/documents"
        media_library:
          config:
            max_file_size: 52428800
        hint: "PDF, DOC, or DOCX. File is saved under public/documents/ as /documents/your-file.pdf"
      - label: "Or external link (Google Drive, etc.)"
        name: "pdf_external"
        widget: "string"
        required: false
        hint: "Use only if not uploading a file. Paste full https:// link."

# ── GALLERY ──────────────────────────────────────────
  - name: "gallery"
    label: "Gallery Photos"
    label_singular: "Gallery Entry"
    folder: "src/content/gallery"
    create: true
    delete: true
    slug: "{{year}}-{{category}}-{{slug}}"
    summary: "{{caption}} ({{year}} · {{category}})"
    fields:
      - { label: "Year", name: "year", widget: "number", value_type: "int", min: 2000, max: 2099 }
      # >>> GALLERY_CATEGORY_SELECT >>>
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Biak In", "Gallery test"]
        hint: "From Archive Registry → Gallery Categories. After adding categories, save registry, then press F5 on admin (auto-syncs when npm run dev is running)."
      # <<< GALLERY_CATEGORY_SELECT <<<
      - { label: "Caption", name: "caption", widget: "string", hint: "Shared caption for all photos in this entry" }
      - label: "Photos (add multiple images per entry)"
        name: "photos"
        widget: "list"
        min: 1
        allow_add: true
        allow_delete: true
        allow_reorder: true
        summary: "{{fields.photo}}"
        field: { label: "Photo", name: "photo", widget: "image" }
      - { label: "Date", name: "date", widget: "datetime", format: "DD.MM.YYYY", date_format: "DD.MM.YYYY", time_format: false, required: false }

# ── COMMITTEE MEMBERS ──────────────────────────────────────────
  - name: "committee_members"
    label: "Committee Members"
    label_singular: "Committee"
    folder: "src/content/committee"
    create: true
    slug: "{{committee_id}}-{{year}}"
    fields:
      - { label: "Committee ID", name: "committee_id", widget: "string", hint: "Must match ID in Archive Registry → Committee List" }
      - { label: "Committee Name", name: "committee_name", widget: "string", hint: "Editable display name for this year" }
      - { label: "Year", name: "year", widget: "number", value_type: "int", min: 2000, max: 2099 }
      - { label: "Group Photo", name: "group_photo", widget: "image", required: false, media_folder: "/public/images/committee", public_folder: "/images/committee" }
      - { label: "Chairman", name: "chairman", widget: "string" }
      - { label: "Secretary", name: "secretary", widget: "string" }
      - label: "Committee Members"
        name: "members"
        widget: "list"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string", default: "Member", required: false }

