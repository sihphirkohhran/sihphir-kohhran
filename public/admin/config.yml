# ── PASTORAL HISTORY ──────────────────────────────────────────
  - name: "pastoral_history"
    label: "Pastoral History"
    label_singular: "Pastor"
    folder: "src/content/pastoral"
    create: true
    delete: true
    slug: "{{start_year}}-{{fields.name}}"
    summary: "{{name}} ({{start_year}})"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false, media_folder: "/public/images/pastoral", public_folder: "/images/pastoral" }
      - { label: "Start Year", name: "start_year", widget: "number", value_type: "int", min: 1800, max: 2099 }
      - { label: "End Year", name: "end_year", widget: "number", value_type: "int", min: 1800, max: 2099, required: false, hint: "Leave empty if currently serving — years served is calculated automatically" }
      - { label: "Notes", name: "notes", widget: "markdown", required: false }

# ── MISSIONARY MINISTRY ───────────────────────────────────────
  - name: "missionary_ministry"
    label: "Missionary Ministry"
    label_singular: "Missionary"
    folder: "src/content/missionaries"
    create: true
    delete: true
    slug: "{{sent_year}}-{{fields.name}}"
    summary: "{{name}} — {{mission_field}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false, media_folder: "/public/images/missionaries", public_folder: "/images/missionaries" }
      - { label: "Mission Field / Location", name: "mission_field", widget: "string" }
      - { label: "Sent Year", name: "sent_year", widget: "number", value_type: "int", min: 1800, max: 2099 }
      - { label: "Status", name: "status", widget: "select", options: ["Active", "On furlough", "Retired", "Returned", "Deceased"] }
      - { label: "Notes", name: "notes", widget: "markdown", required: false }
      - { label: "Prayer Requests", name: "prayer_requests", widget: "markdown", required: false }
      - { label: "Family Photo", name: "family_photo", widget: "image", required: false, media_folder: "/public/images/missionaries", public_folder: "/images/missionaries" }

# ── ELDERS HISTORY ────────────────────────────────────────────
  - name: "elders_history"
    label: "Elders History"
    label_singular: "Elder"
    folder: "src/content/elders"
    create: true
    delete: true
    slug: "{{fields.name}}"
    summary: "{{name}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false, media_folder: "/public/images/elders", public_folder: "/images/elders" }
      - { label: "Ordained Year", name: "ordained_year", widget: "number", value_type: "int", min: 1800, max: 2099 }
      - { label: "Status", name: "status", widget: "string", required: false, hint: "e.g. Active, Retired, Deceased" }
      - { label: "Notes", name: "notes", widget: "markdown", required: false }

# ── NAV MENU ──────────────────────────────────────────
  - name: "navigation"
    label: "Navigation Menu"
    files:
      - name: "nav_items"
        label: "Menu Items (Add / Edit / Delete / Reorder)"
        file: "src/content/settings/navigation.json"
        fields:
          - label: "Menu Items"
            name: "items"
            widget: "list"
            allow_add: true
            allow_delete: true
            allow_reorder: true
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL Path", name: "href", widget: "string", hint: "e.g. /committee or /p/my-page" }
              - { label: "Menu Key", name: "key", widget: "string", hint: "Unique ID, e.g. committee" }
              - { label: "Parent Menu Key", name: "parent", widget: "string", required: false, hint: "Leave empty for top-level. Use parent Menu Key for submenu (e.g. fellowship, Rawngbawltu). Case-insensitive." }
              - { label: "Sort Order", name: "order", widget: "number", value_type: "int", default: 0 }
              - { label: "Show in Menu", name: "visible", widget: "boolean", default: true }
